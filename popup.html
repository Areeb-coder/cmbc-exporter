<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;width:365px;padding:16px;background:#121c20;color:#eef5f4}h2{margin:0 0 8px}label{display:block;margin:10px 0 4px}input,select{box-sizing:border-box;width:100%;padding:9px;border-radius:5px;background:#263439;color:white;border:1px solid #566}button{width:100%;margin-top:12px;padding:11px;background:#1d8059;border:0;border-radius:6px;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;margin-top:12px;padding:10px;background:#253237;border-radius:6px;min-height:28px}small{color:#aab9b8}</style></head><body><h2>Cambridge Battlecode Exporter</h2><label>Export mode</label><select id="mode"><option value="ladder">Leaderboard: rank, team, members</option><option value="matches">Matches: full history + analytics</option></select><div id="ladderFields"><label>Maximum leaderboard rank</label><input id="limit" type="number" min="1" max="500" value="200"></div><div id="matchFields" hidden><label>Your team (exact displayed name)</label><input id="team" value="decrest"><label>Bot version filter (optional)</label><input id="version" placeholder="e.g. v153; blank = all"><label>Opponent filter (optional)</label><input id="opponent" placeholder="e.g. Mite; blank = all"><label>Maximum scan steps</label><input id="steps" type="number" min="20" max="1500" value="350"></div><button id="run">Scan and export Excel</button><div id="status">Open the Cambridge ladder or your team's match-history page before exporting.</div><small>Exports only visible website data. Missing names and IDs remain blank. Match history must be open for match exports.</small><script src="popup.js"></script></body></html>
